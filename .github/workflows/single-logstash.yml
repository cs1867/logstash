name: single-logstash

on: 
  push:
    branches: 
      - github-workflow 
env: 
  BUILD_OS: el9 

jobs:
  logstash-daemon:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Check out Repo
        uses: actions/checkout@v4
        with:
          ref: 5.2.0

      # Fetch workflow script from projects
      - name: Fetch workflow script from projects
        env:
          github-token: ${{ secrets.GIT_ACTIONS }}
        run: |
          git clone https://github.com/cs1867/project.git project
          case "${{ env.BUILD_OS }}" in
            'ol8'|'el9')
              cp project/toolbox/workflows/github-el-workflow.sh .
              ;;
            'd11'|'d12'|'u20'|'u24')
              cp project/toolbox/workflows/github_u20_workflow.sh .
              ;;
          esac

      - name: show run id
        run: |
          echo "${{ github.run_id }}"
          
      # Download artifacts
      - name: Download artifacts
        run: |
          mkdir -p artifacts
          echo "Downloading artifact for minor packages"
          echo "Run ID: 15175075108"
          gh run download 15175075108 --repo cs1867/minor-packages -D artifacts/minor-packages --name "minor-packages-${{ env.BUILD_OS }}"  
          ls -al "$artifact_path/RPMS"
          artifact_path="artifacts/pscheduler"
          echo "Downloading artifact for pscheduler"
          echo "Run ID: 15175184702"
          gh run download 15175184702 --repo cs1867/pscheduler -D artifacts/pscheduler --name "pscheduler-${{ env.BUILD_OS }}"  
          artifact_path="artifacts/pscheduler"
          echo "Downloading artifact for perl-shared"
          echo "Run ID: 15175323247"
          gh run download 15175323247 --repo cs1867/perl-shared -D artifacts/perl-shared --name "perl-shared-${{ env.BUILD_OS }}"  
          artifact_path="artifacts/perl-shared"
          echo "Downloading artifact for psconfig"
          echo "Run ID: 15175328254"
          gh run download 15175328254 --repo cs1867/psconfig -D artifacts/psconfig --name "psconfig-${{ env.BUILD_OS }}"  
          artifact_path="artifacts/psconfig"
          echo "Listing artifact path:"
          case "${{ env.BUILD_OS }}" in
            'ol8'|'el9')
              mkdir -p artifacts/RPMS
              echo "copy to the artifacts RPM dir"
              cp "$artifact_path"/RPMS/*.rpm artifacts/RPMS
            ;;
              'd11'|'d12'|'u20'|'u22'|'u24')                
               ls -al artifacts/*
            ;;
          esac
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_ACTIONS }}

      # Run docker oneshot builder and workflow script
      - name: Run Docker oneshot builder
        run: |
          case "${{ env.BUILD_OS }}" in
            'ol8'|'el9')
              curl -s https://raw.githubusercontent.com/perfsonar/docker-oneshot-builder/main/build | sh -s - --run github-el-workflow.sh . '${{ env.BUILD_OS }}'
              ;;
            'd11'|'d12'|'u20'|'u24')
              curl -s https://raw.githubusercontent.com/perfsonar/docker-oneshot-builder/main/build | sh -s - --run github_u20_workflow.sh . '${{ env.BUILD_OS }}'
              ;;
          esac
      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ env.BUILD_OS }}
          path: unibuild-repo
          retention-days: 5
